# remnawave-monitoring — стек мониторинга: Prometheus + Grafana + node-exporter + blackbox + Uptime Kuma
# + экспортёр панели. Настройки — в .env (см. .env.example). Поднять: docker compose up -d
name: remnawave-monitoring

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-latest}
    container_name: rwmon-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"   # только с самого сервера (ssh -L для просмотра)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  exporter:
    # Экспортёр панели: только стандартная библиотека Python, образ без сборки.
    image: python:${PYTHON_IMAGE_TAG:-3.12-slim}
    container_name: rwmon-exporter
    restart: unless-stopped
    environment:
      - PANEL_URL=${PANEL_URL:?задайте PANEL_URL в .env}
      - PANEL_TOKEN=${PANEL_TOKEN:?задайте PANEL_TOKEN в .env}
      - SCRAPE_SECONDS=${SCRAPE_SECONDS:-30}
      - BRIDGE_TAG=${BRIDGE_TAG:-bridge}
      - BRIDGE_REGEX=${BRIDGE_REGEX:-(?i)bridge}
      - BRIDGE_COUNTRIES=${BRIDGE_COUNTRIES:-}
      - PANEL_INSECURE=${PANEL_INSECURE:-0}
      - LISTEN=0.0.0.0:9200
    volumes:
      - ../exporter/rw_exporter.py:/app/rw_exporter.py:ro
    command: ["python3", "-u", "/app/rw_exporter.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-exporter:
    # Метрики самого сервера мониторинга (CPU, память, диск). Без host-сети: порт 9100 наружу не открывается;
    # сетевые счётчики этого сервера не собираются — для нод они берутся из панели.
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-latest}
    container_name: rwmon-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(host/)?(sys|proc|dev|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_IMAGE_TAG:-latest}
    container_name: rwmon-blackbox
    restart: unless-stopped
    volumes:
      - ./blackbox:/config:ro
    command:
      - --config.file=/config/blackbox.yml

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-latest}
    container_name: rwmon-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?задайте GRAFANA_ADMIN_PASSWORD в .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
      - GF_UNIFIED_ALERTING_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  uptime-kuma:
    # Kuma 2.x (1.x больше не обновляется). При первом входе: SQLite → администратор → remnawave-monitoring kuma-sql --apply
    image: louislam/uptime-kuma:${KUMA_IMAGE_TAG:-2}
    container_name: rwmon-kuma
    restart: unless-stopped
    ports:
      - "${KUMA_BIND:-0.0.0.0}:${KUMA_PORT:-3001}:3001"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - kuma-data:/app/data

volumes:
  prometheus-data:
  grafana-data:
  kuma-data:
